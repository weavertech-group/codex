name: grok-migration-209-check

on:
  push:
    branches:
      - work/grok-rust-v0.154.0-209

permissions:
  contents: read

env:
  RUST_MIN_STACK: "16777216"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --config imports_granularity=Item --check
      - name: Test Grok Guardian and memory model policy
        run: cargo test -p codex-model-provider grok_provider -- --nocapture
      - name: Test stock approval-review model policy
        run: cargo test -p codex-model-provider configured_provider_uses_default_approval -- --nocapture
      - name: Test stock API-key approval-review model policy
        run: cargo test -p codex-model-provider configured_provider_uses_luna_for_approval_review -- --nocapture
